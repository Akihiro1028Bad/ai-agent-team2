[project]
name = "ai-agent-orchestrator"
version = "0.1.0"
description = "AI Multi-Agent Orchestrator - GitHub Issueを自動処理するマルチエージェントシステム"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.15",
    "rich>=13",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "githubkit>=0.14",
    "httpx>=0.28",
    "claude-code-sdk>=0.0.20",
    "python-statemachine>=2.5",
    "keyring>=25",
    "pyyaml>=6",
]

[project.scripts]
ai-agent = "ai_agent_orchestrator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_agent_orchestrator"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6",
    "pytest-mock>=3.14",
    "respx>=0.22",
    "hypothesis>=6.120",
    "mypy>=1.15",
    "ruff>=0.11",
    "pre-commit>=4",
    "types-pyyaml>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "-v",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests requiring real APIs",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

[tool.mypy]
strict = true
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = [
    "claude_code_sdk.*",
    "statemachine.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "ANN",    # flake8-annotations
    "S",      # flake8-bandit (security)
    "C4",     # flake8-comprehensions
    "RUF",    # ruff-specific rules
    "PT",     # flake8-pytest-style
    "TCH",    # flake8-type-checking
    "PERF",   # perflint
]
ignore = [
    "S101",    # use of assert (needed for pytest)
    "TCH003",  # move stdlib import into TYPE_CHECKING block (too strict for dataclasses)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert is fine in tests
    "ANN",     # don't require annotations in tests
]

[tool.ruff.lint.isort]
known-first-party = ["ai_agent_orchestrator"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
